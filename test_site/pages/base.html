<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}The Turing Arcade{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; background: #f7f7f5; color: #222; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: #1f2a24; color: #fff; }
    header a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
    header .brand { font-weight: 700; font-size: 18px; margin: 0; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: #fff; border: 1px solid #e3e1da; border-radius: 8px; padding: 16px; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; background: #ddd; }
    .card h3 { font-size: 15px; margin: 12px 0 4px; }
    .card .price { color: #55604d; font-weight: 600; }
    button, input[type=submit] { background: #3a5a40; color: #fff; border: none; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-size: 14px; }
    button:hover, input[type=submit]:hover { background: #2f4a34; }
    form.narrow { max-width: 420px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; color: #444; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px;
    }
    .cart-items { margin: 20px 0; }
    .cart-items li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .confirmation { background: #e8f3e6; border: 1px solid #b6d9ae; padding: 18px; border-radius: 8px; }
    .muted { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <p class="brand">The Turing Arcade</p>
    <nav>
      <a href="/">Shop</a>
      <a href="/login">Login</a>
      <a href="/checkout">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>
  <script src="/static/collector.js"></script>
  <script src="/static/cart.js"></script>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
