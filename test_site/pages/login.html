{% extends "base.html" %}
{% block title %}Login — The Turing Arcade{% endblock %}
{% block content %}
  <h1>Login</h1>
  <form class="narrow" id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" />

    <p style="margin-top: 18px;">
      <input type="submit" value="Log in" />
    </p>
  </form>
  <p id="login-message" class="muted"></p>

  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (window.ATL) window.ATL.track("login_attempt", {});
      document.getElementById("login-message").textContent = "This is a test site — login is not real. Continue to Shop or Cart.";
    });
  </script>
{% endblock %}
